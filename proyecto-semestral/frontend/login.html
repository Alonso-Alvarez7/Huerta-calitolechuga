<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - HuertoHogar</title>
    <!-- CSS administrativo / principal -->
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="body-publico">

    <!-- 1. EN EL ENCABEZADO / BARRA SUPERIOR DE NAVEGACIÓN -->
    <header class="header-principal">
        <div class="header-contenido">
            <a href="index.html" class="logo-link">
                <img src="img/logo.png" alt="HuertoHogar Logo" class="img-logo">
                <span class="logo-texto">HuertoHogar</span>
            </a>
            <nav class="nav-principal">
                <a href="index.html">Inicio</a>
                <a href="productos.html">Productos</a>
                <a href="nosotros.html">Nosotros</a>
                <a href="blogs.html">Blogs</a>
                <a href="contacto.html">Contacto</a>
            </nav>
            
            <!-- >>> AQUÍ VA EL BOTÓN REGISTRARSE DE LA BARRA SUPERIOR <<< -->
            <div class="header-acciones">
                <a href="login.html" class="btn-login activo">Ingresar</a>
                <a href="registro.html" class="btn-registro">Registrarse</a>
            </div>
            
        </div>
    </header>

    <main class="seccion-login">
        <section class="card-auth">

            <div class="encabezado-auth">
                <h2>Iniciar Sesión</h2>
                <p>Ingresa tus datos para acceder a tu cuenta de HuertoHogar</p>
            </div>

            <form id="loginForm">

                <!-- Correo -->
                <div class="campo-form">
                    <label for="correo">Correo electrónico</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        required
                    >
                </div>

                <!-- Contraseña -->
                <div class="campo-form">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >
                </div>

                <!-- Mensaje de error -->
                <p id="mensajeError" class="mensaje-error"></p>

                <!-- Botón de ingresar -->
                <button type="submit" class="btn-primario">
                    Iniciar sesión
                </button>

            </form>

            <!-- 2. DEBAJO DEL FORMULARIO DE INICIO DE SESIÓN -->
            <!-- >>> AQUÍ VA EL TEXTO / ENLACE DE REGISTRARSE AL PIE DEL CUADRO <<< -->
            <div style="margin-top: 1.2rem; text-align: center;">
                <p>
                    ¿No tienes una cuenta?
                    <a href="registro.html" style="color: var(--acento-verde); font-weight: 600;">Regístrate aquí</a>
                </p>
            </div>

        </section>
    </main>

    <footer class="footer-principal">
        <div class="footer-contenido">
            <p>&copy; 2026 HuertoHogar. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- JavaScript del login -->
    <script src="js/login.js"></script>

</body>
</html>
