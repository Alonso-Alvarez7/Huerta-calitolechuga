<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - HuertoHogar</title>
    <link rel="stylesheet" href="css/admin.css">
</head>


<body class="body-publico">
    <header class="header-principal">
        <div class="header-contenido">
            <a href="index.html" class="logo-link">
                <img src="img/logo.png" alt="HuertoHogar Logo" class="img-logo">
                <span class="logo-texto">HuertoHogar</span>
            </a>
            <nav class="nav-principal">
                <a href="index.html">Inicio</a>
                <a href="productos.html">Productos</a>
                <a href="nosotros.html">Nosotros</a>
                <a href="blogs.html">Blogs</a>
                <a href="contacto.html">Contacto</a>
            </nav>
            <div class="header-acciones">
                <a href="login.html" class="btn-login">Ingresar</a>
                <a href="registro.html" class="btn-registro activo">Registrarse</a>
            </div>
        </div>
    </header>
    <main class="seccion-login">
        <section class="card-auth">
            <div class="encabezado-auth">
                <h2>
                    Crear cuenta
                </h2>
                <p>
                    Regístrate para comenzar a comprar
                    en HuertoHogar.
                </p>
            </div>
            <form id="formRegistro">
                <div class="campo-form">
                    <label for="registroNombre">Nombre completo</label>
                    <input type="text" id="registroNombre" name="nombre" placeholder="Ingresa tu nombre completo"
                        maxlength="100" required>
                    <p id="errorNombre" class="mensaje-error">
                    </p>
                </div>

                <div class="campo-form">
                    <label for="registroEmail">
                        Correo electrónico
                    </label>
                    <input type="email" id="registroEmail" name="email" placeholder="ejemplo@correo.com" maxlength="100"
                        required>
                    <p id="errorEmail" class="mensaje-error">
                    </p>
                </div>

                <div class="campo-form">
                    <label for="registroPassword">Contraseña</label>
                    <input type="password" id="registroPassword" name="password" placeholder="Entre 4 y 10 caracteres"
                        minlength="4" maxlength="10" required>
                    <p id="errorPassword" class="mensaje-error">
                    </p>
                </div>

                <div class="campo-form">
                    <label for="registroPasswordConfirm">Confirmar contraseña</label>
                    <input type="password" id="registroPasswordConfirm" name="passwordConfirm"
                        placeholder="Repite tu contraseña" minlength="4" maxlength="10" required>
                    <p id="errorPasswordConfirm" class="mensaje-error">
                    </p>
                </div>

                <p id="mensajeFeedback" class="mensaje-error"></p>

                <button type="submit" class="btn-primario">Crear cuenta</button>
            </form>

            <div style="margin-top: 1.2rem; text-align: center;">
                <p>¿Ya tienes una cuenta?
                    <a href="login.html" style="color: var(--acento-verde); font-weight: 600;">
                        Inicia sesión aquí
                    </a>
                </p>
            </div>

        </section>
    </main>
    <footer class="footer-principal">
        <div class="footer-contenido">
            <p>
                &copy; 2026 HuertoHogar.
                Todos los derechos reservados.
            </p>
        </div>
    </footer>

    <script src="js/validaciones-registro.js"></script>

</body>
</html>
